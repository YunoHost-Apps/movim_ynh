#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    # Path to source
    root __INSTALL_DIR__/public/;

    index index.php;

    try_files $uri $uri/ __PATH__/index.php$is_args$args;

    location ~ [^/]\.php(/|$) {
        # more_set_headers "X-Cache: $upstream_cache_status";
        # fastcgi_ignore_headers "Cache-Control" "Expires" "Set-Cookie";
        # fastcgi_cache nginx_cache;
        # fastcgi_cache_valid any 7d;
        # fastcgi_cache_bypass $no_cache;
        # fastcgi_no_cache $no_cache;
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
        include fastcgi_params_with_auth;
    }

    location __PATH__/ws/ {
        proxy_pass http://127.0.0.1:__PORT__/;
        include proxy_params_with_auth;
        proxy_redirect off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
